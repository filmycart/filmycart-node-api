name: Node API CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: filmycart_test }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npm audit --omit=dev
      - run: npm test
        env:
          NODE_ENV: test
          APP_PORT: 5000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: filmycart-node-api
          DB_USER: root
          DB_PASSWORD: root
          JWT_ACCESS_SECRET: test_access_secret_long_enough
          JWT_REFRESH_SECRET: test_refresh_secret_long_enough
